<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Juego Apocalíptico</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; margin: 0 auto; background: #222; border: 2px solid #444; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 1px 1px 2px black; }
        #msg { position: absolute; top: 40%; width: 100%; text-align: center; color: #fff; font-size: 24px; display: none; text-shadow: 2px 2px 4px black; }
    </style>
</head>
<body>
    <div id="ui">Esperanza: <span id="hp">100</span>% | Meta: <span id="dist">100</span>%</div>
    <div id="msg"></div>
    <canvas id="c"></canvas>
<script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    c.width = 800; c.height = 400;

    let frame = 0;
    let gameOver = false;
    let win = false;
    let hp = 100;
    let dist = 0;
    const maxDist = 2000;
    
    // Jugador
    const p = { x: 50, y: 300, w: 20, h: 40, dy: 0, jump: false, color: '#ff3333' };
    const gravity = 0.6;
    
    // Teclas
    const keys = {};
    document.addEventListener('keydown', e => keys[e.code] = true);
    document.addEventListener('keyup', e => keys[e.code] = false);

    // Obstáculos
    const obs = [];
    for(let i=0; i<15; i++) obs.push({ x: 600 + i * 150, w: 30, h: 30 + Math.random()*20 });

    function update() {
        if(gameOver || win) return;

        // Movimiento
        if(keys['ArrowRight'] || keys['KeyD']) { p.x += 4; dist += 4; }
        if(keys['ArrowLeft'] || keys['KeyA'] && p.x > 0) p.x -= 4;
        
        // Salto
        if((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && !p.jump) {
            p.dy = -12; p.jump = true;
        }
        p.dy += gravity;
        p.y += p.dy;
        if(p.y > 300) { p.y = 300; p.dy = 0; p.jump = false; }

        // Colisiones
        obs.forEach(o => {
            let screenX = o.x - dist + 100;
            if(p.x < screenX + o.w && p.x + p.w > screenX && p.y < 340 - o.h + o.h && p.y + p.h > 340 - o.h) {
                hp -= 1;
                p.x -= 5;
            }
        });

        // Estado
        if(dist % 10 === 0) hp -= 0.1;
        if(hp <= 0) { gameOver = true; document.getElementById('msg').innerText = "FIN: Te rendiste."; document.getElementById('msg').style.display = 'block'; }
        if(dist >= maxDist) { win = true; document.getElementById('msg').innerHTML = "¡LLEGASTE AL TREN!<br>El tren parte...<br><b>¡TE REENCUENTRAS CON ELLA!</b>"; document.getElementById('msg').style.display = 'block'; document.getElementById('msg').style.color = '#ff69b4'; }

        document.getElementById('hp').innerText = Math.floor(hp);
        document.getElementById('dist').innerText = Math.floor(100 - (dist/maxDist)*100);
    }

    function draw() {
        // Fondo
        ctx.fillStyle = win ? '#87CEEB' : '#1a1a1a';
        ctx.fillRect(0, 0, c.width, c.height);
        
        // Suelo
        ctx.fillStyle = win ? '#4caf50' : '#333';
        ctx.fillRect(0, 340, c.width, 60);

        if(!win && !gameOver) {
            // Jugador
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Ojo
            ctx.fillStyle = '#fff';
            ctx.fillRect(p.x + 12, p.y + 8, 4, 4);

            // Obstáculos
            ctx.fillStyle = '#555';
            obs.forEach(o => {
                let sx = o.x - dist + 100;
                if(sx > -50 && sx < 850) ctx.fillRect(sx, 340 - o.h, o.w, o.h);
            });
        } else if (win) {
            // Escena Final
            ctx.fillStyle = '#ff3333'; // Jugador
            ctx.fillRect(200, 300, 20, 40);
            ctx.fillStyle = '#ff69b4'; // Amada
            ctx.fillRect(600, 300, 20, 40);
            ctx.fillStyle = 'red';
            ctx.font = '40px Arial';
            ctx.fillText('❤', 380, 330);
            
            // Tren de fondo
            ctx.fillStyle = '#777';
            ctx.fillRect(50, 200, 700, 100);
        }
        
        requestAnimationFrame(loop);
    }

    function loop() {
        update();
        draw();
    }
    loop();
</script>
</body>
</html>
